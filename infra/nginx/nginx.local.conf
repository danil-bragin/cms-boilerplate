# Local-only nginx front for the dev stack, so the same-origin image path (/img)
# can be exercised + measured against the host-run web app. Stock nginx:alpine
# (no brotli/zstd module — those are a prod concern; see nginx.conf). The host web
# runs via `pnpm dev`/`next start` on :3000, reached through host.docker.internal.
worker_processes auto;
events { worker_connections 2048; }

http {
  include mime.types;
  gzip on;
  gzip_types text/html text/css application/javascript application/json application/xml text/plain image/svg+xml;

  upstream web      { server host.docker.internal:3000; keepalive 32; }
  upstream imgproxy { server imgproxy:8080;             keepalive 32; }

  proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=img_cache:10m max_size=1g inactive=30d use_temp_path=off;

  server {
    listen 80;

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_buffering off;
    }

    location /img/ {
      rewrite ^/img/(.*)$ /$1 break;
      proxy_pass http://imgproxy;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Accept $http_accept;
      proxy_cache img_cache;
      proxy_cache_key "$uri$http_accept";
      proxy_cache_valid 200 30d;
      proxy_cache_lock on;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Cache-Status $upstream_cache_status;
    }
  }
}
