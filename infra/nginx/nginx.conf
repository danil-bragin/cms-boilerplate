# Reference nginx config for fronting the Next.js pods.
# Why: `next start` only does gzip. Brotli/zstd cut HTML/RSC payloads a further
# ~15-25%. Requires ngx_brotli (and optionally zstd-nginx-module) — both are
# bundled in common builds like nginx-extras / openresty; or use Caddy, which
# ships zstd+gzip out of the box.
#
# nginx >= 1.29 additionally supports proxying 103 Early Hints
# (early_hints on;) — marginal for cached ISR pages, enable if you have it.

worker_processes auto;

events { worker_connections 4096; }

http {
  include mime.types;

  # --- compression ---
  gzip on;
  gzip_comp_level 5;
  gzip_vary on;
  gzip_types text/html text/css application/javascript application/json application/xml text/plain image/svg+xml;

  # ngx_brotli
  brotli on;
  brotli_comp_level 5;
  brotli_types text/html text/css application/javascript application/json application/xml text/plain image/svg+xml;
  # serve pre-compressed .br for immutable assets if you precompress at build
  brotli_static on;

  # zstd-nginx-module (optional; near-universal browser support since Safari 26)
  # zstd on;
  # zstd_comp_level 12;

  upstream web {
    server web:3000;
    keepalive 32;
  }

  # imgproxy behind the same origin so the LCP image reuses the document's warm
  # HTTP/2 connection (no cross-origin handshake) and is cached at this layer —
  # imgproxy has no internal cache, so every uncached request re-encodes (~10x
  # for AVIF). The signed URL path is forwarded verbatim, so signatures still verify.
  upstream imgproxy {
    server imgproxy:8080;
    keepalive 32;
  }
  proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=img_cache:10m max_size=2g inactive=30d use_temp_path=off;

  # 103 Early Hints (nginx >= 1.29.8): pass upstream/CDN-generated 103s to the
  # client, but only for top-level navigations over h2/h3 — h1.1 clients choke.
  map $http_sec_fetch_mode $early_hints {
    navigate $http2$http3;
  }

  # behind a TLS-terminating LB, set HSTS once (here or at the LB). For direct
  # TLS termination on nginx, add `listen 443 ssl;` + certs and keep this header.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  server {
    listen 80;

    # tell Next the original protocol/host (multi-site resolution + OIDC redirects)
    location / {
      early_hints $early_hints;
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      # streaming/PPR friendliness
      proxy_buffering off;
    }

    # immutable Next assets: long cache at this layer too
    location /_next/static/ {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_cache_valid 200 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # same-origin signed images → imgproxy, cached here. Set IMAGE_PUBLIC_BASE=/img
    # on the web app so it emits /img/<sig>/rs:.../plain/s3://... URLs.
    location /img/ {
      rewrite ^/img/(.*)$ /$1 break;          # strip prefix; forward the signed path
      proxy_pass http://imgproxy;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Accept $http_accept;   # imgproxy negotiates AVIF/WebP from Accept
      proxy_cache img_cache;
      proxy_cache_key "$uri$http_accept";     # Vary on Accept (avif vs webp), signed path is immutable
      proxy_cache_valid 200 30d;
      proxy_cache_use_stale error timeout updating;
      proxy_cache_lock on;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Cache-Status $upstream_cache_status;
    }
  }
}
