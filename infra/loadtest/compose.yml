name: cms-loadtest
services:
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  k6:
    image: grafana/k6:latest
    profiles: [run]
    volumes:
      - ./scenario.js:/scenario.js:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["k6", "run", "/scenario.js"]
    environment:
      TARGET: http://lb:8088
