# Runs drizzle migrations before/with a rollout. Helm hook: pre-install +
# pre-upgrade, so a new image is never served against an un-migrated schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          # the api image carries @cms/db + drizzle-kit; run the migrate script
          image: {{ .Values.images.api }}
          command: ["node", "packages/db/dist/migrate.js"]
          workingDir: /repo
          envFrom:
            - secretRef: { name: {{ .Values.existingSecret }} }
            - configMapRef: { name: {{ .Values.existingConfigMap }} }
