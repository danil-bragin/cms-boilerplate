# Two Redis instances — they have INCOMPATIBLE eviction needs:
#  - queue Redis: maxmemory-policy noeviction (BullMQ MUST NOT lose jobs)
#  - cache Redis: notify-keyspace-events Exe (the Next cache handler requires
#    it) + an eviction policy of your choice (allkeys-lru is fine for a cache)
# Pointing both at one instance silently loses scheduled publishes (eviction)
# or OOMs the page cache (noeviction). For real prod use a managed Redis pair;
# these are a working default.
{{- if .Values.redis.deployInCluster }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis-queue
spec:
  replicas: 1
  selector: { matchLabels: { app: {{ .Release.Name }}-redis-queue } }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-redis-queue } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--maxmemory-policy", "noeviction"]
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-redis-queue }
spec:
  selector: { app: {{ .Release.Name }}-redis-queue }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis-cache
spec:
  replicas: 1
  selector: { matchLabels: { app: {{ .Release.Name }}-redis-cache } }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-redis-cache } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --notify-keyspace-events
            - Exe
            - --maxmemory-policy
            - allkeys-lru
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-redis-cache }
spec:
  selector: { app: {{ .Release.Name }}-redis-cache }
  ports: [{ port: 6379, targetPort: 6379 }]
{{- end }}
