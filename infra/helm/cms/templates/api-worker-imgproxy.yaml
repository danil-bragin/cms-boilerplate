apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-api }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-api }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: {{ .Release.Name }}-api }
      containers:
        - name: api
          image: {{ .Values.images.api }}
          ports: [{ containerPort: 3001 }]
          envFrom:
            - configMapRef: { name: {{ .Values.existingConfigMap }} }
            - secretRef: { name: {{ .Values.existingSecret }} }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector: { app: {{ .Release.Name }}-api }
  ports: [{ port: 80, targetPort: 3001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-worker }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-worker }
    spec:
      containers:
        - name: worker
          image: {{ .Values.images.worker }}
          ports: [{ containerPort: 3002 }]
          envFrom:
            - configMapRef: { name: {{ .Values.existingConfigMap }} }
            - secretRef: { name: {{ .Values.existingSecret }} }
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: 3002 }
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-imgproxy
spec:
  replicas: {{ .Values.imgproxy.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-imgproxy }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-imgproxy }
    spec:
      containers:
        - name: imgproxy
          image: {{ .Values.images.imgproxy }}
          ports: [{ containerPort: 8080 }]
          env:
            - name: IMGPROXY_USE_S3
              value: "true"
            - name: IMGPROXY_AUTO_AVIF
              value: "true"
            - name: IMGPROXY_AUTO_WEBP
              value: "true"
          envFrom:
            - secretRef: { name: {{ .Values.existingSecret }} }
          resources: {{- toYaml .Values.imgproxy.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-imgproxy
spec:
  selector: { app: {{ .Release.Name }}-imgproxy }
  ports: [{ port: 80, targetPort: 8080 }]
