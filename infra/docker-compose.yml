name: cms-boilerplate

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # noeviction: required by BullMQ; Exe keyspace events: required by the Next.js
    # Redis cache handler. In production run two Redis instances: one for queues
    # (noeviction) and one for the page cache (allkeys-lru is fine there).
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
        "--notify-keyspace-events",
        "Exe",
      ]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/cms-media &&
      echo 'bucket cms-media ready'
      "

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v4
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      # DEV-ONLY defaults (imgproxy docs example pair) — never reuse outside
      # localhost; set IMGPROXY_KEY/IMGPROXY_SALT in the environment for anything shared
      IMGPROXY_KEY: ${IMGPROXY_KEY:-943b421c9eb07c830af81030552c86009268de4e532ba2ee2eab8247c6da0881}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-520f986b998545b4785e0defbc4f3c1203f22de2374a3d53cb7a7fe9fea309c5}
      IMGPROXY_BIND: ":8080"
      # Accept-header negotiation: AVIF (20-50% smaller) → WebP → original.
      # The CDN in front MUST key its cache on the Accept header (Vary: Accept).
      IMGPROXY_AUTO_AVIF: "true"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_AVIF_SPEED: "8"
    ports:
      - "8081:8080"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Same-origin edge: fronts the host-run web app + imgproxy under one origin with
  # image caching, so the /img same-origin path (the production CDN/nginx pattern)
  # can be exercised + measured locally. Opt-in:
  #   docker compose -f infra/docker-compose.yml --profile edge up -d nginx
  # then run web with IMAGE_PUBLIC_BASE=/img and browse http://localhost:8090
  nginx:
    image: nginx:alpine
    profiles: [edge]
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - imgproxy

  jaeger:
    # opt-in: docker compose --profile observability up -d
    # traces: OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
    image: jaegertracing/all-in-one:latest
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP http
      - "4317:4317" # OTLP grpc

  prometheus:
    # metrics: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://localhost:9090/api/v1/otlp/v1/metrics (signal-specific env is used as-is, no path appended)
    image: prom/prometheus:latest
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards/provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3030:3000"
    depends_on: [prometheus, jaeger]

volumes:
  pg-data:
  redis-data:
  minio-data:
