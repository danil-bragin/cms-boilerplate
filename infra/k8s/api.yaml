apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: cms-api }
  template:
    metadata:
      labels: { app: cms-api }
    spec:
      containers:
        - name: api
          image: cms-api:latest
          ports: [{ containerPort: 3001 }]
          envFrom:
            - configMapRef: { name: cms-config }
            - secretRef: { name: cms-secrets }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cms-api
spec:
  selector: { app: cms-api }
  ports: [{ port: 80, targetPort: 3001 }]
